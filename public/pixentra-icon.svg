<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 105 95" width="105" height="95">
  <!-- Pixel scatter dots top-left of P -->
  <rect x="32" y="18" width="8" height="8" fill="#1a1a1a"/>
  <rect x="24" y="28" width="8" height="8" fill="#1a1a1a"/>
  <rect x="36" y="32" width="6" height="6" fill="#5bb8f5"/>
  <rect x="18" y="40" width="6" height="6" fill="#1a1a1a"/>
  <rect x="28" y="44" width="5" height="5" fill="#5bb8f5"/>
  <rect x="22" y="54" width="4" height="4" fill="#1a1a1a"/>
  <rect x="34" y="50" width="4" height="4" fill="#5bb8f5"/>
  <rect x="16" y="58" width="4" height="4" fill="#5bb8f5"/>

  <!-- P letter vertical stem -->
  <rect x="48" y="20" width="14" height="80" fill="#1a1a1a"/>

  <!-- P letter top horizontal -->
  <rect x="48" y="20" width="40" height="14" fill="#1a1a1a"/>

  <!-- P letter middle horizontal -->
  <rect x="48" y="60" width="38" height="14" fill="#1a1a1a"/>

  <!-- P letter right side arc top -->
  <rect x="88" y="20" width="14" height="18" rx="0" fill="#1a1a1a"/>

  <!-- Eye circle in the P -->
  <circle cx="90" cy="53" r="18" fill="#5bb8f5"/>
  <circle cx="90" cy="53" r="10" fill="white"/>
  <circle cx="90" cy="53" r="6" fill="#1a1a1a"/>
  <circle cx="93" cy="50" r="2" fill="white"/>
  <!-- Eye shine ring -->
  <circle cx="90" cy="53" r="18" fill="none" stroke="#5bb8f5" stroke-width="2" opacity="0.4"/>
  <circle cx="90" cy="53" r="22" fill="none" stroke="#5bb8f5" stroke-width="1" opacity="0.2"/>
</svg>
